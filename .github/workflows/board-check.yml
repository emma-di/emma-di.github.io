# Daily check that the bulletin board's backend is alive.
#
# Best-effort only: GitHub disables scheduled workflows in repos with no
# activity for 60 days, so this can go quiet on its own. The real protection
# is in assets/guestbook.js, which removes the board client-side if the
# backend stops responding.
name: board-check

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe the Worker
        id: probe
        run: |
          API=$(grep -oE "const API = '[^']*'" assets/guestbook.js | sed "s/const API = '//;s/'//")
          if [ -z "$API" ]; then
            echo "No API configured; nothing to check."
            echo "down=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$API/notes" || echo 000)
          echo "  $API/notes -> $CODE"
          if [ "$CODE" = "200" ]; then
            echo "down=false" >> "$GITHUB_OUTPUT"
          else
            echo "down=true" >> "$GITHUB_OUTPUT"
            echo "code=$CODE" >> "$GITHUB_OUTPUT"
            echo "api=$API" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue if it is down
        if: steps.probe.outputs.down == 'true'
        uses: actions/github-script@v7
        env:
          CODE: ${{ steps.probe.outputs.code }}
          API: ${{ steps.probe.outputs.api }}
        with:
          script: |
            const title = 'Bulletin board backend is not responding';
            const { data } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: [],
            });
            if (data.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              ...context.repo,
              title,
              body: [
                `\`${process.env.API}/notes\` returned **${process.env.CODE}**.`,
                '',
                'The board hides itself client-side, so the live site is not showing',
                'a broken section. Nothing is urgent.',
                '',
                'Check the Cloudflare dashboard (Workers & Pages) to see whether the',
                'Worker or its KV binding still exists.',
              ].join('\n'),
            });
